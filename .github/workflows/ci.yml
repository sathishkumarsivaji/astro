name: AstroVerse Production CI/CD & Validation Release Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  lint:
    name: Lint & Code Quality (Oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Clean Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Run Oxlint
        run: cd frontend && npm run lint

  test-unit:
    name: Master Astro-Verification Test Suites
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Clean Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Run Master Frontend Verification Suite
        run: cd frontend && npm test
        env:
          NODE_OPTIONS: '--experimental-vm-modules'

  test-backend:
    name: Production Backend & Security Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Clean Install Backend Dependencies
        run: cd backend && npm ci
      - name: Run Backend Security Tests
        run: cd backend && node test_backend.mjs

  test-golden-astronomy:
    name: Golden Swiss & Node Astronomy Benchmarks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Clean Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Run Manifest Integrity & Independent Benchmarks
        run: |
          cd frontend
          node test_validation_manifest_integrity.mjs
          node test_swiss_ephemeris_benchmark.mjs
          node test_true_node_independent_benchmark.mjs
          node test_cross_system_astronomical_consistency.mjs
          node test_golden_astronomy.mjs
          node test_independent_ephemeris_reference.mjs

  test-convention-fixtures:
    name: Classical Astrological Convention Fixtures
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Clean Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Run Convention & Shodashavarga Fixture Tests
        run: cd frontend && node test_convention_fixtures.mjs

  test-silent-defaults:
    name: Zero Silent Defaults, Claims & Backtesting
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Clean Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Run Anti-Claim, Defaults & Validation Lab Tests
        run: |
          cd frontend
          node test_find_defaults.mjs
          node test_find_claims.mjs
          node test_claim_graph.mjs
          node test_backtesting_validation.mjs
          node test_calendar_engine.mjs

  build:
    name: Production Distribution Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-backend, test-golden-astronomy, test-convention-fixtures, test-silent-defaults]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Clean Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Run Vite Production Build
        run: cd frontend && npm run build
      - name: Check Bundle Size Thresholds
        run: |
          BUNDLE_SIZE=$(du -sb frontend/dist/assets/*.js | awk '{total += $1} END {print total}')
          echo "Total JS bundle size: $BUNDLE_SIZE bytes"
          if [ "$BUNDLE_SIZE" -gt 2621440 ]; then
            echo "::error::Bundle size exceeds 2.5MB hard threshold: $BUNDLE_SIZE bytes"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: frontend/dist/
          retention-days: 7

  security-scan:
    name: High/Critical Security Audit Gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Clean Install Dependencies
        run: |
          cd frontend && npm ci
          cd ../backend && npm ci
      - name: Audit Frontend Production Dependencies (Release Gate)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Audit Backend Production Dependencies (Release Gate)
        run: cd backend && npm audit --omit=dev --audit-level=high

  release-gate:
    name: Release Gate (Mandatory Aggregation)
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-backend, test-golden-astronomy, test-convention-fixtures, test-silent-defaults, build, security-scan]
    steps:
      - name: Verify All Mandatory Release Conditions Passed
        run: |
          echo "================================================================"
          echo " ALL MANDATORY RELEASE-BLOCKING JOBS COMPLETED & VERIFIED 100%"
          echo "================================================================"
          echo " Status: RELEASE_GATE_PASSED"
