name: AstroVerse CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  test-unit:
    name: Master Astro-Verification Test Suites
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test
        env:
          NODE_OPTIONS: '--experimental-vm-modules'

  test-backend:
    name: Production Backend Verification
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: cd backend && node test_backend.mjs

  test-golden-astronomy:
    name: Golden Astronomy Reference Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && node test_golden_astronomy.mjs
      - run: cd frontend && node test_independent_ephemeris_reference.mjs

  test-convention-fixtures:
    name: Convention Fixture Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && node test_convention_fixtures.mjs

  test-silent-defaults:
    name: Zero Silent Defaults & Claim Graph Guard
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && node test_find_defaults.mjs
      - run: cd frontend && node test_find_claims.mjs
      - run: cd frontend && node test_claim_graph.mjs
      - run: cd frontend && node test_calendar_engine.mjs

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-backend, test-golden-astronomy, test-silent-defaults]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      
      # Bundle size check
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sb frontend/dist/assets/*.js | awk '{total += $1} END {print total}')
          echo "Total JS bundle size: $BUNDLE_SIZE bytes"
          # Warn if bundle exceeds 2MB
          if [ "$BUNDLE_SIZE" -gt 2097152 ]; then
            echo "::warning::Bundle size exceeds 2MB threshold: $BUNDLE_SIZE bytes"
          fi
          
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: frontend/dist/
          retention-days: 7

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm audit --production
        continue-on-error: true
